openapi: 3.1.0
info:
  title: Kalen Benakafil API
  description: |
    Community NGO website API — public content, volunteer workflows, staff content management,
    and admin user/volunteer administration.

    **Authentication**: `HttpOnly` cookie-based session. `POST /api/login` sets `access_token`
    (JWT, 15 min) and `refresh_token` (opaque, 7 days). Include `credentials: "include"` on
    every fetch. Mutating requests carrying a session cookie require a matching `Origin` header.

    **Error envelope**: `{"error":{"code":"...","message":"...","details":{}}}`

    **Pagination**: `page` (int, default 1) and `limit` (int, default 10, max 50) query params;
    response `{"items":[...],"page":1,"limit":10,"total":42}`.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

security: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT access token set by POST /api/login or POST /api/refresh

  schemas:
    # ──────────── shared primitives ────────────
    UserRole:
      type: string
      enum: [admin, editor, user, volunteer]

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message, details]

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required: [error]

    # ──────────── domain objects ────────────
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
      required: [id, name, email, role]

    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        title:
          type: string
          maxLength: 180
        content:
          type: string
          maxLength: 20000
        author_id:
          type: integer
          format: int64
        author_name:
          type: string
        published:
          type: boolean
        published_at:
          type: string
          format: date-time
        cover_media_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, slug, title, content]

    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 20000
        event_date:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, title, description, event_date, location]

    Media:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 180
        file_path:
          type: string
        media_type:
          type: string
        original_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [image, video, audio, document]
        created_at:
          type: string
          format: date-time
      required: [id, title, file_path, kind]

    ContactMessage:
      type: object
      description: Contact message as returned to staff
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        status:
          type: string
          enum: [new, read, replied]
        created_at:
          type: string
          format: date-time
        handled_by_name:
          type: string
        handled_at:
          type: string
          format: date-time
      required: [id, name, email, message, status, created_at]

    VolunteerApplicationDTO:
      type: object
      description: Own volunteer application (returned to the applicant)
      properties:
        id:
          type: integer
          format: int64
        skills:
          type: string
        availability:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, declined]
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
      required: [id, skills, availability, status, created_at]

    VolunteerApplicationReviewDTO:
      type: object
      description: Volunteer application as returned to admins (includes applicant identity)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        skills:
          type: string
        availability:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, declined]
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
        reviewer_name:
          type: string
      required: [id, name, email, skills, availability, status, created_at]

    EventAttendeeDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [name, email, created_at]

    Volunteer:
      type: object
      description: Volunteer user with total contribution hours
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
        total_hours:
          type: number
          format: double
      required: [id, name, email, role, total_hours]

    # ──────────── page envelopes ────────────
    Page:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PagePost:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Post"
          required: [items]

    PageEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageMedia:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageContactMessage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactMessage"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageVolunteerApplicationReview:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VolunteerApplicationReviewDTO"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageEventAttendee:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventAttendeeDTO"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    # ──────────── request bodies ────────────
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ContactRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        message:
          type: string
          maxLength: 5000
      required: [name, email, message]

    CreatePostRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
        content:
          type: string
          maxLength: 20000
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        cover_media_id:
          type: integer
          format: int64
      required: [title, content]

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
        content:
          type: string
          maxLength: 20000
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        cover_media_id:
          type: integer
          format: int64
      required: [title, content, slug]

    PublishPostRequest:
      type: object
      properties:
        published:
          type: boolean
      required: [published]

    CreateEventRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 20000
        event_date:
          type: string
          format: date-time
          description: RFC3339 datetime
        ends_at:
          type: string
          format: date-time
          description: Optional; must be after event_date
        location:
          type: string
      required: [title, description, event_date]

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 20000
        event_date:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location:
          type: string
      required: [title, description, event_date]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Optional; when provided, updates the password
      required: [name, email]

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        role:
          $ref: "#/components/schemas/UserRole"
      required: [name, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
      required: [name, email, role]

    AddContributionRequest:
      type: object
      properties:
        hours:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1000
        contribution_date:
          type: string
          format: date
      required: [hours, contribution_date]

    VolunteerApplicationRequest:
      type: object
      properties:
        skills:
          type: string
          maxLength: 2000
        availability:
          type: string
          maxLength: 1000
        message:
          type: string
          maxLength: 5000
      required: [skills, availability]

    ReviewVolunteerApplicationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [approved, declined]
      required: [status]

    UpdateContactMessageStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [read, replied]
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    UploadMediaResponse:
      type: object
      properties:
        message:
          type: string
        file_path:
          type: string
      required: [message, file_path]

  # ──────────── reusable parameters ────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  # ──────────── reusable responses ────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Uniqueness constraint violated (e.g. duplicate email or slug)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: Malformed JSON or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Semantic validation failure (e.g. invalid enum value, ends_at before event_date)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

paths:
  # ═══════════════════════════════════════
  # Auth — public
  # ═══════════════════════════════════════
  /api/register:
    post:
      operationId: register
      summary: Register a new user account
      description: |
        Creates a new account with role `user`. Rate-limited to 10 requests/minute per IP.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/login:
    post:
      operationId: login
      summary: Log in and receive session cookies
      description: |
        Verifies credentials and sets two `HttpOnly` cookies:
        - `access_token`: JWT, 15-minute TTL
        - `refresh_token`: opaque token, 7-day TTL

        Rate-limited to 10 requests/minute per IP+email.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful; cookies set
          headers:
            Set-Cookie:
              description: access_token and refresh_token HttpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/refresh:
    post:
      operationId: refresh
      summary: Rotate session cookies using the refresh token
      description: |
        Requires the `refresh_token` cookie. Issues a new access token and rotates the refresh
        token (old one is revoked). Rate-limited to 10 requests/minute per IP.
      tags: [auth]
      responses:
        "200":
          description: Tokens rotated; new cookies set
          headers:
            Set-Cookie:
              description: New access_token and refresh_token cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token and clear cookies
      tags: [auth]
      responses:
        "200":
          description: Logged out; cookies cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ═══════════════════════════════════════
  # Contact — public
  # ═══════════════════════════════════════
  /api/contact:
    post:
      operationId: createContact
      summary: Submit a contact message
      description: Rate-limited to 30 requests/minute per IP.
      tags: [contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ═══════════════════════════════════════
  # Public content
  # ═══════════════════════════════════════
  /api/posts:
    get:
      operationId: getPosts
      summary: List published posts
      description: Returns published posts paginated, newest first. Supports full-text search.
      tags: [posts]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
      responses:
        "200":
          description: Paginated published posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePost"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/posts/{slug}:
    get:
      operationId: getPostBySlug
      summary: Get a published post by slug
      description: Drafts return 404.
      tags: [posts]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]{3,100}$"
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events:
    get:
      operationId: getEvents
      summary: List events
      description: |
        Returns paginated events. When `upcoming=true`, returns future events ascending by date;
        otherwise newest-created first.
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: upcoming
          in: query
          description: When "true", return only future events sorted ascending
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageEvent"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{id}:
    get:
      operationId: getEventByID
      summary: Get an event by ID
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media:
    get:
      operationId: getMedia
      summary: List media
      description: Filtered, paginated media items.
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: kind
          in: query
          description: Filter by media kind
          schema:
            type: string
            enum: [image, video, audio, document]
      responses:
        "200":
          description: Paginated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMedia"
        "422":
          description: Invalid kind value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ═══════════════════════════════════════
  # Protected — any authenticated user
  # ═══════════════════════════════════════
  /api/me:
    get:
      operationId: me
      summary: Get the currently authenticated user
      x-roles: [admin, editor, user, volunteer]
      tags: [profile]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile:
    get:
      operationId: getProfile
      summary: Get the authenticated user's profile
      x-roles: [admin, editor, user, volunteer]
      tags: [profile]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateProfile
      summary: Update the authenticated user's profile
      x-roles: [admin, editor, user, volunteer]
      tags: [profile]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email already used by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/me/volunteer-application:
    post:
      operationId: createVolunteerApplication
      summary: Submit a volunteer application
      description: A user may only submit one application; subsequent attempts return 409.
      x-roles: [user, volunteer, editor, admin]
      tags: [volunteer]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerApplicationRequest"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerApplicationDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Application already exists or role not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: getMyVolunteerApplication
      summary: Get the current user's volunteer application
      x-roles: [admin, editor, user, volunteer]
      tags: [volunteer]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Own application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerApplicationDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
