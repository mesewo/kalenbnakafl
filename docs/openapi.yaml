              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: uploadMedia
      summary: Upload a media file
      description: |
        Accepts only JPEG, PNG, and WebP image content, sniffed independently of the filename and
        declared Content-Type. Images are limited to 10,000 pixels per side and 40 megapixels,
        EXIF-oriented, metadata-stripped,
        re-encoded, and stored as 480/960/1600px responsive variants. Maximum size is configured
        by `MEDIA_MAX_MB` (default 50 MB). Both en and am alt text are required unless `decorative`
        is explicitly true.
      x-roles: [admin, editor]
      tags: [staff, media]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                translations:
                  type: string
                  description: JSON object with en and am alt_text values; titles are optional.
                decorative:
                  type: string
                  enum: ["true", "false"]
                  description: Explicit true is the only way to omit both localized alt texts.
              required: [file, translations]
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMediaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: File type not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

