openapi: 3.1.0
info:
  title: Kalen Benakafil API
  description: |
    Community NGO website API — public content, volunteer workflows, staff content management,
    and admin user/volunteer administration.

    **Authentication**: `HttpOnly` cookie-based session. `POST /api/login` sets `access_token`
    (JWT, 15 min) and `refresh_token` (opaque, 7 days). Include `credentials: "include"` on
    every fetch. Mutating requests carrying a session cookie require a matching `Origin` header.

    **Error envelope**: `{"error":{"code":"...","message":"...","details":{}}}`

    **Pagination**: `page` (int, default 1) and `limit` (int, default 10, max 50) query params;
    response `{"items":[...],"page":1,"limit":10,"total":42}`.

    **Content language**: Posts, events, media, and site-content reads accept `?lang=en|am`; when
    omitted, `Accept-Language` selects the locale and English is the default. Missing translations
    fall back to the available locale, reported by `language` and `fallback` in each item.

    **Message language**: Response messages use `?lang`, then a supported `lang` cookie, then
    `Accept-Language`, with English as the default.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

security: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT access token set by POST /api/login or POST /api/refresh

  schemas:
    # ──────────── shared primitives ────────────
    UserRole:
      type: string
      enum: [admin, editor, user, volunteer]

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message, details]

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required: [error]

    # ──────────── domain objects ────────────
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
      required: [id, name, email, role]

    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        title:
          type: string
          maxLength: 180
        content:
          type: string
          maxLength: 20000
        author_id:
          type: integer
          format: int64
        author_name:
          type: string
        published:
          type: boolean
        published_at:
          type: string
          format: date-time
        cover_media_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/PostTranslations"}
      required: [id, slug, title, content, language, fallback]

    PostTranslation:
      type: object
      properties:
        title: {type: string, maxLength: 180}
        content:
          type: string
          maxLength: 20000
          description: Plain text with line breaks; inline images use only {{media:<id>}} tokens. Arbitrary Markdown image URLs are rejected.
      required: [title, content]
    PostTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/PostTranslation"}
        am: {$ref: "#/components/schemas/PostTranslation"}
      additionalProperties: false

    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 20000
        event_date:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        cover_media_id:
          type: integer
          format: int64
        location:
          type: string
        created_at:
          type: string
          format: date-time
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/EventTranslations"}
      required: [id, title, description, event_date, location, language, fallback]

    EventTranslation:
      type: object
      properties:
        title: {type: string, maxLength: 180}
        description: {type: string, maxLength: 20000}
        location: {type: string, maxLength: 500}
      required: [title, description, location]
    EventTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/EventTranslation"}
        am: {$ref: "#/components/schemas/EventTranslation"}
      additionalProperties: false

    Media:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 180
        file_path:
          type: string
        media_type:
          type: string
        original_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [image]
        alt_text:
          type: string
          maxLength: 500
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        decorative:
          type: boolean
        created_at:
          type: string
          format: date-time
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/MediaTranslations"}
      required: [id, title, file_path, kind, language, fallback, alt_text, width, height, decorative]

    MediaTranslation:
      type: object
      properties:
        title: {type: string, maxLength: 180}
        alt_text: {type: string, maxLength: 500}
      required: [alt_text]
    MediaTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/MediaTranslation"}
        am: {$ref: "#/components/schemas/MediaTranslation"}
      additionalProperties: false

    MediaUsage:
      type: object
      properties:
        usage_type:
          type: string
          enum: [post_cover, post_inline, event_cover, home_slide, about_image, site_setting]
        reference_id: {type: integer, format: int64}
        label: {type: string}
      required: [usage_type, reference_id, label]

    SiteTextTranslation:
      type: object
      properties:
        text:
          type: string
          maxLength: 20000
          description: Plain text with line breaks; raw HTML markup is rejected.
      required: [text]

    SiteTextTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/SiteTextTranslation"}
        am: {$ref: "#/components/schemas/SiteTextTranslation"}
      required: [en, am]
      additionalProperties: false

    HomeSlideTranslation:
      type: object
      properties:
        caption: {type: string, maxLength: 2000}
      required: [caption]

    HomeSlideTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/HomeSlideTranslation"}
        am: {$ref: "#/components/schemas/HomeSlideTranslation"}
      required: [en, am]
      additionalProperties: false

    HomeSlide:
      type: object
      properties:
        id: {type: integer, format: int64}
        media_id: {type: integer, format: int64}
        image_url: {type: string}
        caption: {type: string}
        link: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/HomeSlideTranslations"}
      required: [id, media_id, image_url, caption, link, sort_order, active, language, fallback]

    HomeSlideInput:
      type: object
      properties:
        media_id: {type: integer, format: int64}
        link: {type: string, maxLength: 1000, pattern: "^/(?!/)"}
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
        active: {type: boolean}
        translations: {$ref: "#/components/schemas/HomeSlideTranslations"}
      required: [media_id, link, sort_order, active, translations]

    SiteSettingsTranslation:
      type: object
      properties:
        site_name: {type: string, maxLength: 180}
        tagline: {type: string, maxLength: 1000}
      required: [site_name, tagline]

    SiteSettingsTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/SiteSettingsTranslation"}
        am: {$ref: "#/components/schemas/SiteSettingsTranslation"}
      required: [en, am]
      additionalProperties: false

    SiteSettings:
      type: object
      properties:
        logo_media_id: {type: integer, format: int64, nullable: true}
        logo_url: {type: string}
        favicon_media_id: {type: integer, format: int64, nullable: true}
        favicon_url: {type: string}
        social_image_media_id: {type: integer, format: int64, nullable: true}
        social_image_url: {type: string}
        site_name: {type: string}
        tagline: {type: string}
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/SiteSettingsTranslations"}
      required: [logo_url, favicon_url, social_image_url, site_name, tagline, language, fallback]

    SiteSettingsInput:
      type: object
      properties:
        logo_media_id: {type: integer, format: int64, nullable: true}
        favicon_media_id: {type: integer, format: int64, nullable: true}
        social_image_media_id: {type: integer, format: int64, nullable: true}
        translations: {$ref: "#/components/schemas/SiteSettingsTranslations"}
      required: [translations]

    SiteBlock:
      type: object
      properties:
        page: {type: string}
        key: {type: string}
        text: {type: string}
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        updated_at: {type: string, format: date-time}
        updated_by_name: {type: string}
        translations: {$ref: "#/components/schemas/SiteTextTranslations"}
      required: [page, key, text, language, fallback, updated_at]

    SiteBlockInput:
      type: object
      properties:
        translations: {$ref: "#/components/schemas/SiteTextTranslations"}
      required: [translations]

    AboutImageTranslation:
      type: object
      properties:
        caption: {type: string, maxLength: 2000}
      required: [caption]

    AboutImageTranslations:
      type: object
      properties:
        en: {$ref: "#/components/schemas/AboutImageTranslation"}
        am: {$ref: "#/components/schemas/AboutImageTranslation"}
      required: [en, am]
      additionalProperties: false

    AboutImage:
      type: object
      properties:
        id: {type: integer, format: int64}
        media_id: {type: integer, format: int64}
        image_url: {type: string}
        caption: {type: string}
        sort_order: {type: integer}
        language: {type: string, enum: [en, am]}
        fallback: {type: boolean}
        translations: {$ref: "#/components/schemas/AboutImageTranslations"}
      required: [id, media_id, image_url, caption, sort_order, language, fallback]

    AboutImageInput:
      type: object
      properties:
        media_id: {type: integer, format: int64}
        sort_order: {type: integer, minimum: 0, maximum: 1000000}
        translations: {$ref: "#/components/schemas/AboutImageTranslations"}
      required: [media_id, sort_order, translations]

    ContactMessage:
      type: object
      description: Contact message as returned to staff
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        status:
          type: string
          enum: [new, read, replied]
        created_at:
          type: string
          format: date-time
        handled_by_name:
          type: string
        handled_at:
          type: string
          format: date-time
      required: [id, name, email, message, status, created_at]

    VolunteerApplicationDTO:
      type: object
      description: Own volunteer application (returned to the applicant)
      properties:
        id:
          type: integer
          format: int64
        skills:
          type: string
        availability:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, declined]
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
      required: [id, skills, availability, status, created_at]

    VolunteerApplicationReviewDTO:
      type: object
      description: Volunteer application as returned to admins (includes applicant identity)
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        skills:
          type: string
        availability:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, approved, declined]
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
        reviewer_name:
          type: string
      required: [id, name, email, skills, availability, status, created_at]

    EventAttendeeDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [name, email, created_at]

    Volunteer:
      type: object
      description: Volunteer user with total contribution hours
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
        total_hours:
          type: number
          format: double
      required: [id, name, email, role, total_hours]

    # ──────────── page envelopes ────────────
    Page:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PagePost:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Post"
          required: [items]

    PageEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageMedia:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageContactMessage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactMessage"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageVolunteerApplicationReview:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VolunteerApplicationReviewDTO"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    PageEventAttendee:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventAttendeeDTO"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
      required: [items, page, limit, total]

    # ──────────── request bodies ────────────
    PasswordInput:
      type: string
      minLength: 12
      x-maxBytes: 72
      description: At least 12 Unicode characters and at most 72 UTF-8 bytes; common passwords and values containing the account name or email are rejected.

    OptionalPasswordInput:
      oneOf:
        - $ref: "#/components/schemas/PasswordInput"
        - type: string
          maxLength: 0
      description: Omit or send an empty string to leave the existing password unchanged; otherwise the full password policy applies.

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/PasswordInput"
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ContactRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        message:
          type: string
          maxLength: 5000
      required: [name, email, message]

    CreatePostRequest:
      type: object
      properties:
        translations:
          allOf:
            - $ref: "#/components/schemas/PostTranslations"
          minProperties: 1
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        cover_media_id:
          type: integer
          format: int64
      required: [translations]

    UpdatePostRequest:
      type: object
      properties:
        translations:
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            en: {oneOf: [{$ref: "#/components/schemas/PostTranslation"}, {type: "null"}]}
            am: {oneOf: [{$ref: "#/components/schemas/PostTranslation"}, {type: "null"}]}
          additionalProperties: false
        slug:
          type: string
          pattern: "^[a-z0-9-]{3,100}$"
        cover_media_id:
          type: integer
          format: int64
        clear_cover_media:
          type: boolean
      required: [translations]

    PublishPostRequest:
      type: object
      properties:
        published:
          type: boolean
      required: [published]

    CreateEventRequest:
      type: object
      properties:
        translations:
          allOf:
            - $ref: "#/components/schemas/EventTranslations"
          minProperties: 1
        event_date:
          type: string
          format: date-time
          description: RFC3339 datetime
        ends_at:
          type: string
          format: date-time
          description: Optional; must be after event_date
        cover_media_id:
          type: integer
          format: int64
      required: [translations, event_date]

    UpdateEventRequest:
      type: object
      properties:
        translations:
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            en: {oneOf: [{$ref: "#/components/schemas/EventTranslation"}, {type: "null"}]}
            am: {oneOf: [{$ref: "#/components/schemas/EventTranslation"}, {type: "null"}]}
          additionalProperties: false
        event_date:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        cover_media_id:
          type: integer
          format: int64
        clear_cover_media:
          type: boolean
      required: [translations, event_date]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/OptionalPasswordInput"
      required: [name, email]

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/PasswordInput"
        role:
          $ref: "#/components/schemas/UserRole"
      required: [name, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        password:
          $ref: "#/components/schemas/OptionalPasswordInput"
      required: [name, email, role]

    AddContributionRequest:
      type: object
      properties:
        hours:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 1000
        contribution_date:
          type: string
          format: date
      required: [hours, contribution_date]

    VolunteerApplicationRequest:
      type: object
      properties:
        skills:
          type: string
          maxLength: 2000
        availability:
          type: string
          maxLength: 1000
        message:
          type: string
          maxLength: 5000
      required: [skills, availability]

    ReviewVolunteerApplicationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [approved, declined]
      required: [status]

    UpdateContactMessageStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [read, replied]
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    UploadMediaResponse:
      type: object
      properties:
        message:
          type: string
        id:
          type: integer
          format: int64
        file_path:
          type: string
        width: {type: integer}
        height: {type: integer}
      required: [message, id, file_path, width, height]

  # ──────────── reusable parameters ────────────
  parameters:
    LanguageParam:
      name: lang
      in: query
      required: false
      description: Requested locale; defaults from Accept-Language when omitted.
      schema:
        type: string
        enum: [en, am]
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  # ──────────── reusable responses ────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Uniqueness constraint violated (e.g. duplicate email or slug)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: Malformed JSON or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Semantic validation failure (e.g. invalid enum value, ends_at before event_date)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

paths:
  # ═══════════════════════════════════════
  # Auth — public
  # ═══════════════════════════════════════
  /api/register:
    post:
      operationId: register
      summary: Register a new user account
      description: |
        Creates a new account with role `user`. Rate-limited to 10 requests/minute per IP.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/login:
    post:
      operationId: login
      summary: Log in and receive session cookies
      description: |
        Verifies credentials and sets two `HttpOnly` cookies. Unknown accounts and incorrect
        passwords receive the same 401 response; unknown accounts use a dummy bcrypt comparison.
        - `access_token`: JWT, 15-minute TTL
        - `refresh_token`: opaque token, 7-day TTL

        Rate-limited to 10 requests/minute per IP+email.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful; cookies set
          headers:
            Set-Cookie:
              description: access_token and refresh_token HttpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
