        "500": {$ref: "#/components/responses/InternalServerError"}

  /api/media/{id}/file:
    get:
      operationId: getPublicMediaFile
      summary: Serve a public responsive image variant
      description: Accepts widths 480, 960, and 1600; supports ETag validation and byte ranges.
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: w
          in: query
          schema: {type: integer, enum: [480, 960, 1600], default: 1600}
      responses:
        "200":
          description: Re-encoded public image
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, example: "public, max-age=31536000, immutable"}}
            Accept-Ranges: {schema: {type: string, example: bytes}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "206":
          description: Partial image response for a byte range
        "304": {description: ETag matched; no body}
        "404": {$ref: "#/components/responses/NotFound"}
        "416": {description: Requested byte range is not satisfiable}
        "500": {$ref: "#/components/responses/InternalServerError"}
    head:
      operationId: headPublicMediaFile
      summary: Return public image headers without a body
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: w
          in: query
          schema: {type: integer, enum: [480, 960, 1600], default: 1600}
      responses:
        "200": {description: Public image headers}
        "404": {$ref: "#/components/responses/NotFound"}

