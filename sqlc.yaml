version: "2"
sql:
  - engine: "postgresql"
    schema: "server/db/migrations"
    queries: "server/db/query"
    gen:
      go:
        package: "dbgen"
        out: "server/dbgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_exact_table_names: false
        rename:
          medium: Media
