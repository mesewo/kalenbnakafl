name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan full git history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-vulnerabilities:
    name: Scan reachable Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image-vulnerabilities:
    name: Scan API and frontend images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f server/dockerfile -t kalenbnakafl-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build --build-arg API_INTERNAL_URL=http://api:8080 -f front-end/Dockerfile -t kalenbnakafl-frontend:${{ github.sha }} front-end
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kalenbnakafl-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kalenbnakafl-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
