name: API keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API (best effort)
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$RENDER_API_URL" ]; then
            echo "RENDER_API_URL is not configured; skipping best-effort ping."
            exit 0
          fi
          if ! curl --fail --silent --show-error --max-time 30 "${RENDER_API_URL%/}/healthz" >/dev/null; then
            echo "Render keepalive ping failed; scheduled GitHub Actions are best-effort." >&2
          fi
