name: Frontend

on:
  push:
    paths:
      - "front-end/**"
      - "docs/openapi.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "front-end/**"
      - "docs/openapi.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/frontend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run gen:api
      - run: git diff --exit-code types/api.d.ts
      - run: npm run check:i18n
      - name: Report potentially unused catalog keys
        run: npm run report:unused-messages
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm run build
      - name: Build the standalone frontend image
        run: docker build --build-arg API_INTERNAL_URL=https://build-api.example.invalid -t kalenbnakafl-frontend:ci -f Dockerfile .
      - name: Smoke test standalone image and non-root runtime
        shell: bash
        run: |
          node -e 'require("http").createServer((req,res)=>{res.setHeader("content-type","application/json");res.end(JSON.stringify({runtimeTarget:"ok"}))}).listen(18080,"0.0.0.0")' &
          mock_api_pid=$!
          docker run -d --name frontend-standalone-check --add-host host.docker.internal:host-gateway -p 127.0.0.1:3001:3000 -e API_INTERNAL_URL=http://host.docker.internal:18080 kalenbnakafl-frontend:ci
          trap 'docker rm -f frontend-standalone-check >/dev/null 2>&1 || true; kill "$mock_api_pid" >/dev/null 2>&1 || true' EXIT
          runtime_user="$(docker inspect --format '{{.Config.User}}' frontend-standalone-check)"
          if [[ -z "$runtime_user" || "$runtime_user" == "0" || "$runtime_user" == "0:0" ]]; then
            echo "Frontend container must run as a non-root user"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:3001/healthz >/dev/null; then
            docker logs frontend-standalone-check
            exit 1
          fi
          proxy_response="$(curl --fail --silent http://127.0.0.1:3001/api/runtime-check)"
          if [[ "$proxy_response" != '{"runtimeTarget":"ok"}' ]]; then
            echo "Runtime API_INTERNAL_URL was not used by the standalone API proxy"
            echo "$proxy_response"
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  content-smoke:
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Create ephemeral Compose credentials
        shell: bash
        run: |
          {
            echo "POSTGRES_USER=smoke"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=kalenbnakafl_smoke"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CORS_ORIGINS=http://127.0.0.1:3000"
            echo "ADMIN_EMAIL=smoke-admin@example.invalid"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and start Compose stack
        run: docker compose -f ../docker-compose.yaml up --build -d
      - name: Wait for API and frontend
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f ../docker-compose.yaml logs
          exit 1
      - run: npx playwright test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: front-end/test-results/
          if-no-files-found: ignore
