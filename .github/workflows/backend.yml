name: backend

on:
  workflow_call:
  push:
    paths:
      - "server/**"
      - "infra/minio/**"
      - "docker-compose.yaml"
      - "render.yaml"
      - ".github/workflows/deployment.yml"
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/demo-reset.yml"
      - "docs/DEPLOYMENT.md"
      - "sqlc.yaml"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "infra/minio/**"
      - "docker-compose.yaml"
      - "render.yaml"
      - ".github/workflows/deployment.yml"
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/demo-reset.yml"
      - "docs/DEPLOYMENT.md"
      - "sqlc.yaml"
      - "Makefile"
      - ".github/workflows/backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
      DATABASE_URL_TEST: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            infra/minio/version
      - name: Check migration round trip
        working-directory: server
        run: |
          go tool goose -dir db/migrations postgres "$DATABASE_URL" up
          go tool goose -dir db/migrations postgres "$DATABASE_URL" down-to 0
          go tool goose -dir db/migrations postgres "$DATABASE_URL" up
      - name: Check generated sqlc code
        working-directory: server
        run: go tool sqlc diff -f ../sqlc.yaml
      - name: Build
        working-directory: server
        run: go build ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test with MinIO
        working-directory: server
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
          MINIO_ROOT_USER: test-key-id
          MINIO_ROOT_PASSWORD: test-secret-key-long
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: kalenbnakafl-test
          S3_TEST_ACCESS_KEY_ID: test-key-id
          S3_TEST_SECRET_ACCESS_KEY: test-secret-key-long
          S3_TEST_PATH_STYLE: "true"
        run: |
          mkdir -p "$GOBIN" "$RUNNER_TEMP/minio-data"
          MINIO_VERSION="$(cat ../infra/minio/version)"
          for attempt in 1 2 3; do
            if go install -ldflags="-s -w" "github.com/minio/minio@${MINIO_VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "MinIO install failed after three attempts." >&2
              exit 1
            fi
            delay="$((attempt * 10))"
            echo "MinIO install attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            "$GOBIN/minio" server "$RUNNER_TEMP/minio-data" \
            --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          minio_pid=$!
          trap 'kill "$minio_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; then
              go test ./...
              exit $?
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log" >&2
          echo "MinIO did not become ready" >&2
          exit 1
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: server
