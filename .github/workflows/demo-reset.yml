name: Reset demo content

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    concurrency:
      group: demo-content-reset
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      MIGRATE_ON_START: "false"
      STORAGE_DRIVER: s3
      S3_PATH_STYLE: "true"
      DB_MAX_OPEN_CONNS: "2"
      DB_MAX_IDLE_CONNS: "1"
      DEMO_EDITOR_EMAIL: ${{ vars.DEMO_EDITOR_EMAIL }}
      DEMO_EDITOR_PASSWORD: ${{ secrets.DEMO_EDITOR_PASSWORD }}
      DEMO_VOLUNTEER_EMAIL: ${{ vars.DEMO_VOLUNTEER_EMAIL }}
      DEMO_VOLUNTEER_PASSWORD: ${{ secrets.DEMO_VOLUNTEER_PASSWORD }}
      DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
      S3_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      S3_REGION: ${{ vars.B2_REGION }}
      S3_BUCKET: ${{ vars.B2_MEDIA_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.B2_MEDIA_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.B2_MEDIA_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Validate demo reset settings
        run: |
          test -n "$DATABASE_URL" || { echo "Missing NEON_DIRECT_DATABASE_URL secret"; exit 1; }
          test -n "$DEMO_EDITOR_EMAIL" || { echo "Missing DEMO_EDITOR_EMAIL repository variable"; exit 1; }
          test -n "$DEMO_EDITOR_PASSWORD" || { echo "Missing DEMO_EDITOR_PASSWORD secret"; exit 1; }
          test -n "$DEMO_VOLUNTEER_EMAIL" || { echo "Missing DEMO_VOLUNTEER_EMAIL repository variable"; exit 1; }
          test -n "$DEMO_VOLUNTEER_PASSWORD" || { echo "Missing DEMO_VOLUNTEER_PASSWORD secret"; exit 1; }
          test -n "$S3_ENDPOINT" || { echo "Missing B2_ENDPOINT repository variable"; exit 1; }
          test -n "$S3_REGION" || { echo "Missing B2_REGION repository variable"; exit 1; }
          test -n "$S3_BUCKET" || { echo "Missing B2_MEDIA_BUCKET repository variable"; exit 1; }
          test -n "$S3_ACCESS_KEY_ID" || { echo "Missing B2_MEDIA_ACCESS_KEY_ID secret"; exit 1; }
          test -n "$S3_SECRET_ACCESS_KEY" || { echo "Missing B2_MEDIA_SECRET_ACCESS_KEY secret"; exit 1; }
      - name: Run idempotent demo seed/reset
        working-directory: server
        env:
          JWT_SECRET: ${{ secrets.DEMO_SEED_EPHEMERAL_JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET="$(openssl rand -hex 32)"
            export JWT_SECRET
          fi
          go run ./cmd/seed-demo
