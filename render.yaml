services:
  - type: web
    name: kalenbnakafl-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./server/dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_MAX_OPEN_CONNS
        value: "5"
      - key: DB_MAX_IDLE_CONNS
        value: "2"
      - key: DB_CONNECT_RETRIES
        value: "8"
      - key: TRUST_FORWARDED_HEADERS
        value: "true"
      - key: FORWARDED_HEADERS_SECRET
        sync: false
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PATH_STYLE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MIGRATE_ON_START
        value: "true"
